<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car Compare</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef1f4;--card:#fff;--text:#14181f;--muted:#5d6775;--line:#d9dee5;
  --a:#1f5eff;--a-soft:#e3ebff;--b:#d9780a;--b-soft:#fdecd6;--input:#f6f8fa;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1318;--card:#171c23;--text:#eef1f5;--muted:#9aa5b3;--line:#2a323d;
  --a:#6f95ff;--a-soft:#1b2a52;--b:#f0a043;--b-soft:#3a2a12;--input:#10151b;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1318;--card:#171c23;--text:#eef1f5;--muted:#9aa5b3;--line:#2a323d;
  --a:#6f95ff;--a-soft:#1b2a52;--b:#f0a043;--b-soft:#3a2a12;--input:#10151b;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 16px 56px}
h1{font:700 clamp(34px,6vw,52px)/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 6px;letter-spacing:.5px}
.sub{color:var(--muted);margin:0 0 22px;max-width:56ch}
form{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.panel{background:var(--card);border:1px solid var(--line);border-top-width:4px;border-radius:10px;padding:12px;min-width:0}
.panel.a{border-top-color:var(--a)}.panel.b{border-top-color:var(--b)}
.panel h2{font:700 22px "Barlow Condensed",sans-serif;margin:0 0 10px}
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.brand{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 2px 6px;font:400 12px/1.1 "IBM Plex Sans",sans-serif;cursor:pointer}
.brand img,.brand svg{width:36px;height:36px;object-fit:contain;border-radius:8px;background:#fff}
.brand svg,.brand img:not(.sq){padding:3px}
.brand span{text-align:center;overflow-wrap:anywhere}
.brand:hover{border-color:var(--muted)}
.brand:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.panel.a .brand.on{border-color:var(--a);background:var(--a-soft);box-shadow:inset 0 0 0 1px var(--a)}
.panel.b .brand.on{border-color:var(--b);background:var(--b-soft);box-shadow:inset 0 0 0 1px var(--b)}
.step{font:600 13px "IBM Plex Sans",sans-serif;color:var(--muted);margin:12px 0 6px}
.step:first-child{margin-top:0}
.row input,.panel input[type=search]{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;font:400 15px "IBM Plex Sans",sans-serif}
.panel input[hidden]{display:none}
.picked .sumtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:17px}
.chg{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font:500 13px "IBM Plex Sans",sans-serif;cursor:pointer}
.chg:hover{background:var(--input)}
.picked[hidden],.acc details[hidden],.acc .ver[hidden]{display:none}
.acc{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--input)}
.acc[hidden]{display:none}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{padding:10px 12px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"▾";color:var(--muted)}
.acc details[open] summary::after{content:"▴"}
.acc summary small{font-weight:400;color:var(--muted);margin-left:auto}
.acc .ver{display:block;width:100%;text-align:left;background:transparent;color:var(--text);border:0;border-bottom:1px solid var(--line);padding:10px 12px;font:400 14px/1.35 "IBM Plex Sans",sans-serif;cursor:pointer}
.acc details .ver{padding-left:26px}
.acc details .ver:last-child,.acc>.ver:last-child{border-bottom:0}
.acc .ver:hover{background:var(--card)}
.panel.a .ver.on{background:var(--a-soft);box-shadow:inset 3px 0 0 var(--a)}
.panel.b .ver.on{background:var(--b-soft);box-shadow:inset 3px 0 0 var(--b)}
.acc .engs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.acc .eng{font-size:12px;line-height:1.3;padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--muted)}.acc .eng:hover{color:var(--text);border-color:var(--muted)}
.era{display:block;width:fit-content;max-width:100%;padding:3px 10px;border-radius:999px;font:600 13px/1.35 "IBM Plex Sans",sans-serif}
th .era{margin-top:8px;font-size:12px}
.era[hidden]{display:none}
.e0{background:#1f7a46;color:#fff}.e1{background:#c8c21a;color:#1a1a00}.e2{background:#e08a1e;color:#1a1000}.e3{background:#c8432f;color:#fff}.e4{background:#8a4f3a;color:#fff}.e5{background:#6f5d8a;color:#fff}
.row{display:grid;gap:8px;margin-top:12px}
.row select,.row input{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:400 15px "IBM Plex Sans",sans-serif}
.row select:disabled{opacity:.6}
.row input[hidden]{display:none}
.field{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-top-width:4px}
.field.a{border-top-color:var(--a)}.field.b{border-top-color:var(--b)}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;border:0;background:transparent;color:var(--text);font:600 18px "IBM Plex Sans",sans-serif;outline:none;padding:4px 0}
.field:focus-within{box-shadow:0 0 0 2px var(--text)}
.vs{align-self:center;font:700 22px "Barlow Condensed",sans-serif;color:var(--muted)}
.go{grid-column:1/-1;justify-self:start;background:var(--text);color:var(--bg);border:0;border-radius:8px;padding:12px 26px;font:600 16px "IBM Plex Sans",sans-serif;cursor:pointer}
.go:disabled{opacity:.5;cursor:wait}
.go:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chips button{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:5px 12px;font:400 14px "IBM Plex Sans",sans-serif;cursor:pointer}
.chips button:hover{background:var(--card)}
.chips button:focus-visible{outline:2px solid var(--a)}
#out{margin-top:28px}
.msg{padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.msg.err{border-style:solid;color:var(--text)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
thead th{border-bottom-width:4px;vertical-align:bottom}
thead th.ca{border-bottom-color:var(--a)}thead th.cb{border-bottom-color:var(--b)}
.cname{font:700 26px/1.05 "Barlow Condensed","Arial Narrow",sans-serif}
.cbody{font-weight:400;font-size:14px;color:var(--muted)}
td.k{color:var(--muted);font-size:14px;width:26%}
tr.sec td{background:var(--input);font-weight:600;font-size:14px;padding:6px 14px}
td.win.ca{background:var(--a-soft);font-weight:600}td.win.cb{background:var(--b-soft);font-weight:600}
td.win::after{content:" ✓";color:var(--muted);font-weight:400}
ul{margin:0;padding-left:18px}li{margin:2px 0}
.note{font-size:13px;color:var(--muted);margin-top:14px}
@media (max-width:760px){form{grid-template-columns:1fr}.vs{text-align:center}}
@media (prefers-reduced-motion:no-preference){.go{transition:opacity .15s}}

/* redesign: sidebar pickers + results */
main{max-width:1320px;padding:22px 20px 56px}
.head{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:clamp(30px,4vw,42px);margin:0}
.sub{margin:0;max-width:none}
.layout{display:grid;grid-template-columns:minmax(320px,410px) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}
.layout>*,form,.panel{min-width:0}
main{overflow-x:clip}
form{display:flex;flex-direction:column;gap:12px}
@media(min-width:1001px){form{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;padding:2px}}
.vs,.go{display:none}
.panel{border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 20px -14px rgba(0,0,0,.35)}
.panel h2{font-size:15px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.panel.a.open h2{color:var(--a)}.panel.b.open h2{color:var(--b)}
.picked .sumtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-size:17px;line-height:1.25}
.picked strong.empty{color:var(--muted);font-weight:400}
.chg{background:var(--text);color:var(--bg);border:0;border-radius:8px;padding:6px 14px;font:600 13px "IBM Plex Sans",sans-serif;cursor:pointer;flex:none}
.brands{grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:5px}
.brand{padding:6px 2px 4px;font-size:10px;border-radius:8px}
.brand img,.brand svg{width:26px;height:26px}
.brands.row1{display:flex;overflow-x:auto;padding-bottom:4px}
.brands.row1 .brand{flex:0 0 62px}
.step{font:600 12px "IBM Plex Sans",sans-serif;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:10px 0 5px}
.step:first-child{margin-top:0}
.panel input[type=search]{padding:8px 10px;margin-bottom:6px}
.acc{max-height:max(160px,calc(100vh - 450px));border-radius:10px}
.right{min-width:0}
.chips{flex-wrap:nowrap;overflow-x:auto;margin:0 0 12px;padding-bottom:4px}
.chips button{white-space:nowrap;font-size:13px;padding:4px 12px}
#out{margin-top:0}
.msg{padding:56px 20px;text-align:center;font-size:17px;border-radius:14px}
table{border-collapse:separate;border-spacing:0}
.scroll{border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 20px -14px rgba(0,0,0,.35)}
th{padding:12px 16px}td{padding:10px 16px}
.cname{font-size:30px}
@media(min-width:1001px){.scroll{overflow:visible}thead th{position:sticky;top:0;z-index:2;background:var(--card);border-radius:0}}

/* larger brand tiles */
.brands{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.brand{padding:8px 3px 6px;font-size:12px;gap:4px;border-radius:10px}
.brand img,.brand svg{width:40px;height:40px}
.brand span{font-size:12px;line-height:1.15}
.brands.row1 .brand{flex:0 0 82px}

/* modern look + motion */
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes drift{to{transform:translate3d(2%,3%,0) scale(1.08)}}
@keyframes shine{to{background-position:100% 0}}
@keyframes glowA{0%{box-shadow:inset 0 0 0 2px var(--a)}100%{box-shadow:inset 0 0 0 0 transparent}}
@keyframes glowB{0%{box-shadow:inset 0 0 0 2px var(--b)}100%{box-shadow:inset 0 0 0 0 transparent}}

h1{background:linear-gradient(90deg,var(--text) 30%,var(--a) 75%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 9s ease-in-out infinite alternate}
.head{animation:rise .6s backwards}
.panel{border-radius:20px;background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-color:color-mix(in srgb,var(--line) 70%,transparent);transition:box-shadow .35s,transform .35s;animation:rise .6s backwards}
#pb{animation-delay:.1s}.right{animation:rise .6s .18s backwards}
.panel>div:not([hidden]){animation:rise .4s backwards}
.brand{background:color-mix(in srgb,var(--input) 85%,transparent);transition:transform .2s cubic-bezier(.3,1.4,.5,1),box-shadow .2s,border-color .2s,background .2s}
.brand:hover{transform:translateY(-3px);box-shadow:0 10px 18px -10px rgba(0,0,0,.4)}
.brand:active{transform:scale(.95)}
.brand.on{animation:pop .38s}
.chg,.chips button{transition:transform .18s,box-shadow .18s,background .18s}
.chg:hover,.chips button:hover{transform:translateY(-2px);box-shadow:0 8px 14px -8px rgba(0,0,0,.45)}
.chg:active,.chips button:active{transform:scale(.96)}
.panel input[type=search]{border-radius:12px;transition:box-shadow .2s,border-color .2s}
.panel input[type=search]:focus{outline:0;border-color:var(--text);box-shadow:0 0 0 3px color-mix(in srgb,var(--text) 14%,transparent)}
.acc{border-radius:14px;background:color-mix(in srgb,var(--input) 80%,transparent);scrollbar-width:thin}
.acc>*,.acc details .ver{animation:rise .35s backwards}
.acc .ver{transition:background .15s,transform .18s}
.acc .ver:hover{transform:translateX(4px)}
.acc summary{transition:background .15s}.acc summary:hover{background:var(--card)}
.acc summary::after{transition:transform .25s}
.acc details[open] summary::after{content:"▾";transform:rotate(180deg)}
.era{animation:pop .45s backwards}
.scroll{border-radius:20px;background:color-mix(in srgb,var(--card) 88%,transparent)}
#out>*{animation:rise .5s backwards}
#out tbody tr{animation:rise .45s backwards}
tbody tr:not(.sec):hover td:not(.win){background:color-mix(in srgb,var(--text) 5%,transparent)}
td.win{transition:background .2s}
td.win.ca{animation:glowA 1.2s .5s backwards}td.win.cb{animation:glowB 1.2s .5s backwards}
.cname{animation:rise .6s .1s backwards}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.acc details .ver:nth-child(2){animation-delay:0.00s}
.acc>*:nth-child(1){animation-delay:0.000s}
.acc details .ver:nth-child(3){animation-delay:0.03s}
.acc>*:nth-child(2){animation-delay:0.025s}
.acc details .ver:nth-child(4){animation-delay:0.06s}
.acc>*:nth-child(3){animation-delay:0.050s}
.acc details .ver:nth-child(5){animation-delay:0.09s}
.acc>*:nth-child(4){animation-delay:0.075s}
.acc details .ver:nth-child(6){animation-delay:0.12s}
.acc>*:nth-child(5){animation-delay:0.100s}
.acc details .ver:nth-child(7){animation-delay:0.15s}
.acc>*:nth-child(6){animation-delay:0.125s}
.acc details .ver:nth-child(8){animation-delay:0.18s}
.acc>*:nth-child(7){animation-delay:0.150s}
.acc details .ver:nth-child(9){animation-delay:0.21s}
.acc>*:nth-child(8){animation-delay:0.175s}
.acc details .ver:nth-child(10){animation-delay:0.24s}
.acc>*:nth-child(9){animation-delay:0.200s}
.acc details .ver:nth-child(11){animation-delay:0.27s}
.acc>*:nth-child(10){animation-delay:0.225s}
.acc details .ver:nth-child(12){animation-delay:0.30s}
.acc>*:nth-child(11){animation-delay:0.250s}
.engsel{margin-top:10px}.engsel[hidden]{display:none}.engsel select{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:400 14px "IBM Plex Sans",sans-serif}
</style>
</head>
<body>
<main>
  <div class="head"><h1>Car Compare</h1>
  <p class="sub">Pick two cars and compare their specs side by side. Works offline.</p></div>
  <div class="layout">
  <form id="f" autocomplete="off">
    <section class="panel a" id="pa"></section>
    <div class="vs">vs</div>
    <section class="panel b" id="pb"></section>
    <button class="go" id="go" type="submit">Compare cars</button>
  </form>
  <div class="right">
  <div class="chips" id="chips" aria-label="Example comparisons"></div>
  <div id="out"><div class="msg">Pick two cars on the left and the comparison appears here.</div></div>
  </div></div>
  </main>

const BRAND=Object.fromEntries(BR.map(([n,l,m])=>[n,{models:m}]));
const S={a:{},b:{}},R={};
function carKey(s){const c=S[s];return c.brand&&c.model?c.brand+"|"+c.model:""}
function opt(v,t){const o=el("option",null,t);o.value=v;return o}
/* Škoda, VW, Audi and BMW: pick a model family first (Octavia, Golf, A3 …), then a version (Mk4, vRS Mk3, GTI Mk8 …). */
const GROUPED=new Set(["Škoda","Volkswagen","Audi","BMW"]);
const OVR={"Q8":["Q8","",""],"Q8 e-tron":["Q8","","e-tron"],"Enyaq":["Enyaq","",""],"Enyaq Coupé":["Enyaq","","Coupé"],"Enyaq RS":["Enyaq","","RS"]};
const GENRE=/^(.+?)\s+([IVX]+(?:\/[IVX]+)?|[A-Z]\d{1,2}|\d[A-Z]|FY|Type 1)(?:\s+(.+))?$/;
const ROM={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8};
function split(m){if(OVR[m])return OVR[m];const x=GENRE.exec(m);return x?[x[1],x[2],x[3]||""]:[m,"",""]}
const genLabel=g=>ROM[g]?"Mk"+ROM[g]:g;
/* Engine choices: rows with a "grp" (26th field) are engines of that base generation; they are picked in the Engine box, not listed as versions. */
const engsOf=(n,k)=>{const d=DB[n+"|"+k];if(!d)return[];const b=d.grp||k;return[b,...Object.keys(DB).filter(x=>x.startsWith(n+"|")&&DB[x].grp===b).map(x=>x.slice(n.length+1))].sort((x,y)=>(DB[n+"|"+x].power_hp||0)-(DB[n+"|"+y].power_hp||0))};
const famCache={};
function famOf(n){
  if(famCache[n])return famCache[n];
  const m={};BRAND[n].models.forEach(k=>{if(DB[n+"|"+k]&&!DB[n+"|"+k].grp)(m[GROUPED.has(n)?split(k)[0]:k]=m[GROUPED.has(n)?split(k)[0]:k]||[]).push(k)});
  return famCache[n]=m;
}
function verLabel(n,k,f){
  const [,g,v]=split(k),x=DB[n+"|"+k];if(!x.yFrom)return f||k;const e=eraOf(x.yFrom),t=f?f:([v,genLabel(g)].filter(Boolean).join(" ")||"Standard");
  return e[2]+" "+t+" · "+x.yFrom+"–"+(x.yTo||"")+(f||engsOf(n,k).length>1?"":" · "+x.engine);
}
function accList(s,n,m){
  const r=R[s],c=S[s],fm=famOf(n),d=k=>DB[n+"|"+k];r.acc.replaceChildren();r.q.value="";
  const btn=(k,t)=>{const b=el("button","ver",t);b.type="button";b.dataset.k=k;b.onclick=()=>{c.model=k;r.acc.querySelectorAll(".ver").forEach(x=>x.classList.toggle("on",x.dataset.k===k));chosen(s)};b.dataset.t=(t+" "+engsOf(n,k).map(x=>DB[n+"|"+x].engine).join(" ")).toLowerCase();
    const en=engsOf(n,k);if(en.length>1){const w=el("span","engs");en.forEach(ek=>{const e=el("span","eng",DB[n+"|"+ek].engine.split(/\s(?=\d\.\d|\d+(?:\.\d)?\s*kWh|\d+\s*hp)/)[0]);e.title=DB[n+"|"+ek].engine;e.onclick=ev=>{ev.stopPropagation();c.model=ek;r.acc.querySelectorAll(".ver").forEach(x=>x.classList.toggle("on",x===b));chosen(s)};w.append(e)});b.append(w)}
    return b};
  Object.keys(fm).sort((x,y)=>(fm[y].length>1)-(fm[x].length>1)||x.localeCompare(y,"cs")).forEach(f=>{

    [...ks].sort((x,y)=>(d(y).yFrom||0)-(d(x).yFrom||0)||(split(x)[2]?1:0)-(split(y)[2]?1:0)||x.localeCompare(y)).forEach(k=>dt.append(btn(k,verLabel(n,k))));
    r.acc.append(dt)});
  const on=m&&r.acc.querySelector('.ver[data-k="'+m.replace(/"/g,'\\"')+'"]');

}
function modelOptions(n){
  const f=document.createDocumentFragment();f.append(opt("","Choose a model"));
  const ms=BRAND[n].models,dated=ms.filter(x=>DB[n+"|"+x]&&DB[n+"|"+x].yFrom);
  if(!dated.length){ms.forEach(x=>f.append(opt(x,x)));return f}
  ERAS.forEach(e=>{
    const g=[...dated].filter(x=>eraOf(DB[n+"|"+x].yFrom)===e).sort((a,b)=>DB[n+"|"+b].yFrom-DB[n+"|"+a].yFrom);

    f.append(og)});

}
function showTag(s){

}

  let wa=0,wb=0,tie=0;const t=el("table");
  const hr=el("tr");hr.append(el("th"));
  [[A,"ca"],[B,"cb"]].forEach(([c,k])=>{const th=el("th",k);th.append(el("div","cname",c.name||"Unknown"),el("div","cbody",c.body||""));if(c.yFrom){const t=el("div","era "+eraOf(c.yFrom)[3],eraText(c));th.append(t)}hr.append(th)});
  const thead=el("thead");thead.append(hr);t.append(thead);
  const tb=el("tbody");
  const kind=f=>/plug/i.test(f||"")?"phev":/electric/i.test(f||"")?"ev":"ice";
  const sameFuel=()=>kind(A.fuel)===kind(B.fuel);
  ROWS.forEach(r=>{
    if(r.length===1){const tr=el("tr","sec");const td=el("td",null,r[0]);td.colSpan=3;tr.append(td);tb.append(tr);return}
    const [k,label,unit,dir]=r;const va=A[k],vb=B[k];
    if(va==null&&vb==null)return;
    const tr=el("tr");tr.append(el("td","k",label+(unit&&unit!=="★"&&unit!=="€"?" ("+unit+")":unit==="€"?" (€)":"")));
    const ca=el("td","ca",va==null?"–":fmt(va)),cb=el("td","cb",vb==null?"–":fmt(vb));
    if(dir&&typeof va==="number"&&typeof vb==="number"&&!(k==="consumption"&&!sameFuel())){
      if(va===vb)tie++;else{const aWins=dir==="hi"?va>vb:va<vb;(aWins?ca:cb).classList.add("win");aWins?wa++:wb++}
    }
    tr.append(ca,cb);tb.append(tr);
  });
  t.append(tb);
  const sc=el("div","scroll");sc.append(t);out.append(sc);
  out.append(el("p","note","Figures are approximate and describe one typical European version of each model (named in the column header). Škoda models are listed by generation and coloured by launch year; the older the car, the rougher the numbers. Check the maker’s page or a classic-car source before you decide."));
}

$("#f").addEventListener("submit",e=>{
  e.preventDefault();
  const ka=carKey("a"),kb=carKey("b");
  if(!ka||!kb){msg("Choose a brand, model and version for both cars.",true);return}
  const A=DB[ka],B=DB[kb];
  if(!A||!B){msg("No data for "+(!A?ka:kb).replace("|"," ")+" yet.",true);return}
  render(A,B);
});

new MutationObserver(()=>document.querySelectorAll("#out tbody tr").forEach((t,i)=>t.style.animationDelay=Math.min(i*28,640)+"ms")).observe($("#out"),{childList:true});
</script>
</body>
</html>
